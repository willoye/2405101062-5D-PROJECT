<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perjalanan Selesai | Jemputin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="selesai">
  <main class="app no-nav">
    <header class="top center">
      <div class="logo" style="border-radius:50%;font-size:30px">&#10003;</div>
      <h1>Perjalanan Selesai</h1>
      <p>Terima kasih telah memakai Jemputin</p>
    </header>

    <section class="card up" id="summary"></section>

    <section class="card center">
      <b id="rateTitle">Beri rating</b>
      <div class="stars" id="stars"></div>
      <textarea class="field" id="review" rows="2" placeholder="Tulis komentar (opsional)" style="font-weight:400"></textarea>
    </section>

    <button type="button" class="btn" id="sendRating">Kirim Rating</button>
    <a class="btn o mt" id="skipBtn" href="riwayat.html">Lewati</a>
  </main>
  <script src="js/script.js" defer></script>
</body>
</html>
